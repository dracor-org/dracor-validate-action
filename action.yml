name: "XML validation"
description: "Validate XML documents against Relax NG and Schematron schemas"
author: "Carsten Milling <cmil@hashtable.de>"

inputs:
  files:
    description: "Files to validate"
    required: true
    default: ""
  schema:
    description: "Schema to validate against"
    required: false
    default: "tei"
  version:
    description: "Schema version to validate against"
    required: false
    default: ""
  warn-only:
    description: "Exit gracefully when validation fails"
    required: false
    default: "false"
  unique-ids:
    description: >
      Optional glob of TEI files whose root xml:id will be checked for
      corpus-wide uniqueness. The scope is the union of `files` and
      `unique-ids`; leave empty to disable the check.
    required: false
    default: ""

outputs:
  errors:
    description: "Number of errors"

runs:
  using: docker
  image: docker://dracor/validate-action:3.1.0
  env:
    INPUT_SCHEMA: ${{ inputs.schema }}
    INPUT_VERSION: ${{ inputs.version }}
    INPUT_FILES: ${{ inputs.files }}
    INPUT_UNIQUE_IDS: ${{ inputs.unique-ids }}
